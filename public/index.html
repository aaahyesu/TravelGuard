<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Guard</title>
    <!-- DNS 미리 확인 -->
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!-- 사전 연결 설정 -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />

    <!-- Globe 텍스처 이미지 미리 로드 -->
    <link
      rel="preload"
      href="//unpkg.com/three-globe/example/img/earth-dark.jpg"
      as="image"
      crossorigin
    />
    <link
      rel="preload"
      href="//unpkg.com/three-globe/example/img/earth-topology.png"
      as="image"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
